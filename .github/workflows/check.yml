name: Verify strategy release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 6ab2468279e926d107788f63d7fe219b85f67b4a
            repository: sganggs/Stronghold-Protocol
          - host: b3deebdae4a92642c007d217a1a4573e5d3612c5
            repository: sganggs/Stronghold-Protocol
          - host: c9d804f470b8d7422ae04eb66faf671cef21ad52
            repository: sganggs/Stronghold-Protocol
          - host: fddf41fe8f5b85e87951d85b53df2d800948a387
            repository: zhewang448/Stronghold-Protocol
            extended: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node tools/verify-benchmarks.mjs
      - run: npm run build
      - name: Check out the tested game host
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.host }}
          path: .cache/upstream
      - run: npm ci
        working-directory: .cache/upstream
      - name: Integrate without changing the host checkout
        run: npm run test:integration
        env:
          SP_GAME_REPO: ${{ github.workspace }}/.cache/upstream
          ARTURIA_TEST_REF: ${{ matrix.host }}
          LAVINIA_TEST_REFS: ${{ matrix.host }}
      - name: Verify extended-host groups, pools and recovery
        if: matrix.extended
        run: npm run test:extended
        env:
          SP_GAME_REPO: ${{ github.workspace }}/.cache/upstream
          ARTURIA_TEST_REF: ${{ matrix.host }}
          SP_EXTENDED_DUAL: 1
      - name: Verify service restart on the current release
        if: matrix.host == 'b3deebdae4a92642c007d217a1a4573e5d3612c5'
        run: npm run test:restart
        env:
          SP_GAME_REPO: ${{ github.workspace }}/.cache/upstream
          ARTURIA_TEST_REF: ${{ matrix.host }}
